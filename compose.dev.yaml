# Local development overrides. Layer on top of the base file. The base file
# requires POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB, so supply the
# local-only values from the example env file (never commit a real .env):
#   docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml up -d --build
#
# This publishes the database on the host (for psql and the integration test
# suite), mounts the source, config, and contracts into the application
# processes so edits are picked up without rebuilding, and creates the
# disposable test database. The base production contract (no db host port,
# baked image, no test database) is unchanged when this file is not used.
# The POSTGRES_* variables from the base file (including POSTGRES_HOST=db) are
# inherited unchanged; no hand-built DATABASE_URL is supplied in either file.

services:
  db:
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  api:
    command:
      - uvicorn
      - daily_signal.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./contracts:/app/contracts

  worker:
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./contracts:/app/contracts

  scheduler:
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./contracts:/app/contracts
