name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, type check, and test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://daily_signal:daily_signal@localhost:5432/daily_signal_test
      TEST_DATABASE_URL: postgresql+asyncpg://daily_signal:daily_signal@localhost:5432/daily_signal_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: daily_signal
          POSTGRES_PASSWORD: daily_signal
          POSTGRES_DB: daily_signal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_signal -d daily_signal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -v
