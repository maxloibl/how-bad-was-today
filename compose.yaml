# Production-shaped Compose runtime for Daily Signal.
#
# PostgreSQL is intentionally NOT published to the host here: only the API
# exposes a port. Migrations and source seeding run once as the ``migrate``
# service, and the API/worker/scheduler wait for it to complete successfully, so
# the application never creates schema on its own.
#
# Database credentials are mandatory in this file — there is no default
# password in the production base. Supply them from the environment or an env
# file, for example:
#   docker compose --env-file .env.example up -d --build
# For local development with source mounts and a host database port, layer the
# dev override on top:
#   docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml up

name: daily-signal

# Every service shares one image tag and one build context, so a fresh ``up``
# builds once and never tries to pull ``daily-signal:latest``.
x-app: &app
  image: daily-signal:latest
  build:
    context: .
    dockerfile: Dockerfile

x-database-env: &database-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP (-h), not the Unix socket: during init PostgreSQL answers
      # pg_isready on a temporary socket-only server, which would report healthy
      # before the real TCP listener accepts connections.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot controlled migration + seed step. Never restarts; every other
  # service gates on its successful completion.
  migrate:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-env
    command: sh -c "alembic upgrade head && python -m daily_signal.cli seed-sources"
    restart: "no"

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-env
    command: python -m daily_signal.cli worker
    restart: unless-stopped

  scheduler:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-env
    command: python -m daily_signal.cli scheduler
    restart: unless-stopped

volumes:
  db-data:
