[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-signal"
version = "0.1.0"
description = "Read-only public API for published Daily Signal daily news reports"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy[asyncio]",
    "tzdata",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "asgi-lifespan",
    "httpx",
    "jsonschema",
    "mypy",
    "openapi-spec-validator",
    "pytest",
    "pytest-asyncio",
    "referencing",
    "ruff",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daily_signal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
